<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AUDIO TEST</title>
    <style>
      body { margin: 0; padding: 8px; background: #101018; color: #d8d8e8; font: 11px monospace; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      #status { margin-bottom: 6px; color: #f8d848; }
      #grid { display: grid; grid-template-columns: repeat(4, 248px); gap: 6px; }
      .item { background: #1c1c2c; padding: 3px; border: 1px solid #303048; }
      .item.bad { border-color: #f03030; }
      .item .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .item .m { color: #9090b0; }
      canvas { display: block; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <h1>AIR FRIEND HOCKEY - master chain transfer</h1>
    <div id="status">rendering...</div>
    <div id="grid"></div>

  </body>
</html>
